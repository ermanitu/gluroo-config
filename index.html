<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Gluroo Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f7;
      color: #1c1c1e;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 20px;
      font-weight: 700;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: #3a3a3c;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input:focus {
      border-color: #ff4700;
    }
    .help-text {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 6px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn-save {
      background-color: #ff4700; /* Pebble Orange */
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-cancel {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
  </style>
</head>
<body>

  <h2 id="header-title">Gluroo Settings</h2>

  <div class="card">
    <label for="glucose_url" id="label-url">Gluroo / Nightscout Server URL:</label>
    <input 
      type="url" 
      id="glucose_url" 
      placeholder="https://your-server.herokuapp.com" 
      spellcheck="false" 
      autocorrect="off" 
      autocapitalize="none"
    >
    <div class="help-text" id="help-text">Enter your Gluroo or Nightscout endpoint URL.</div>
  </div>

  <button class="btn btn-save" id="btn-save">Save Settings</button>
  <button class="btn btn-cancel" id="btn-cancel">Cancel</button>

  <script>
    // Diccionario de traducciones
    var i18n = {
      es: {
        title: "Ajustes de Gluroo",
        header: "Ajustes de Gluroo",
        label: "URL del Servidor Gluroo / Nightscout:",
        placeholder: "https://tu-servidor.herokuapp.com",
        help: "Introduce la URL de tu servidor Gluroo o Nightscout.",
        save: "Guardar Ajustes",
        cancel: "Cancelar"
      },
      en: {
        title: "Gluroo Settings",
        header: "Gluroo Settings",
        label: "Gluroo / Nightscout Server URL:",
        placeholder: "https://your-server.herokuapp.com",
        help: "Enter your Gluroo or Nightscout endpoint URL.",
        save: "Save Settings",
        cancel: "Cancel"
      }
    };

    // Detección automática del idioma del dispositivo/navegador
    var userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var lang = userLang.indexOf('es') === 0 ? 'es' : 'en';
    var t = i18n[lang];

    // Aplicar los textos localizados
    document.getElementById('page-title').innerText = t.title;
    document.getElementById('header-title').innerText = t.header;
    document.getElementById('label-url').innerText = t.label;
    document.getElementById('glucose_url').placeholder = t.placeholder;
    document.getElementById('help-text').innerText = t.help;
    document.getElementById('btn-save').innerText = t.save;
    document.getElementById('btn-cancel').innerText = t.cancel;

    // Función para leer parámetros de la URL
    function getQueryParam(variable, defaultValue) {
      var query = location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultValue || false;
    }

    // Si se pasa la URL guardada previamente en la query string, la autocompleta
    var prefillUrl = getQueryParam('glucose_url', '');
    if (prefillUrl) {
      document.getElementById('glucose_url').value = prefillUrl;
    }

    // Botón GUARDAR
    document.getElementById('btn-save').addEventListener('click', function() {
      var urlValue = document.getElementById('glucose_url').value.trim();

      var configData = {
        'glucose_url': urlValue
      };

      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to + encodeURIComponent(JSON.stringify(configData));
    });

    // Botón CANCELAR
    document.getElementById('btn-cancel').addEventListener('click', function() {
      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to;
    });
  </script>
</body>
</html>
