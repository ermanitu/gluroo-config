<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajustes de Glucosa</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f7;
      color: #1c1c1e;
    }
    h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #ff4700; }
    .help-text {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 6px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-save {
      background-color: #ff4700;
      color: white;
      margin-bottom: 10px;
    }
    .btn-cancel {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
  </style>
</head>
<body>

  <h2>Configuración de Glucosa</h2>

  <div class="card">
    <label for="glucose_url">URL del Servidor / API (Nightscout / Dexcom):</label>
    <input type="url" id="glucose_url" placeholder="https://mi-servidor.herokuapp.com" spellcheck="false" autocorrect="off" autocapitalize="none">
    <div class="help-text">Ejemplo: https://tu-sitio.fly.dev</div>
  </div>

  <button class="btn btn-save" id="btn-save">Guardar URL</button>
  <button class="btn btn-cancel" id="btn-cancel">Cancelar</button>

  <script>
    function getQueryParam(variable, defaultValue) {
      var query = location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultValue || false;
    }

    document.getElementById('btn-save').addEventListener('click', function() {
      var urlValue = document.getElementById('glucose_url').value.trim();
      var configData = {
        'glucose_url': urlValue
      };
      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to + encodeURIComponent(JSON.stringify(configData));
    });

    document.getElementById('btn-cancel').addEventListener('click', function() {
      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to;
    });
  </script>
</body>
</html>
