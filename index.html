<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Gluroo Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f7;
      color: #1c1c1e;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 20px;
      font-weight: 700;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: #3a3a3c;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      font-family: monospace;
    }
    input:focus {
      border-color: #ff4700;
    }
    .help-text {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 6px;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn-save {
      background-color: #ff4700; /* Pebble Orange */
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-cancel {
      background-color: #e5e5ea;
      color: #1c1c1e;
    }
  </style>
</head>
<body>

  <h2 id="header-title">Gluroo Settings</h2>

  <div class="card">
    <label for="api_key" id="label-api">Gluroo API Key / Token:</label>
    <input 
      type="text" 
      id="api_key" 
      placeholder="e8bae8c4-0c1e-4b5b-9387-698fc0fd6cf4" 
      spellcheck="false" 
      autocorrect="off" 
      autocapitalize="none"
    >
    <div class="help-text" id="help-text">Enter your Gluroo access token.</div>
  </div>

  <button class="btn btn-save" id="btn-save">Save API Key</button>
  <button class="btn btn-cancel" id="btn-cancel">Cancel</button>

  <script>
    var i18n = {
      es: {
        title: "Ajustes de Gluroo",
        header: "Ajustes de Gluroo",
        label: "API Key / Token de Gluroo:",
        placeholder: "Pega tu token de Gluroo aquí",
        help: "Introduce el token de acceso de tu cuenta Gluroo.",
        save: "Guardar Token",
        cancel: "Cancelar"
      },
      en: {
        title: "Gluroo Settings",
        header: "Gluroo Settings",
        label: "Gluroo API Key / Token:",
        placeholder: "Paste your Gluroo token here",
        help: "Enter your Gluroo access token.",
        save: "Save API Key",
        cancel: "Cancel"
      }
    };

    var userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    var lang = userLang.indexOf('es') === 0 ? 'es' : 'en';
    var t = i18n[lang];

    document.getElementById('page-title').innerText = t.title;
    document.getElementById('header-title').innerText = t.header;
    document.getElementById('label-api').innerText = t.label;
    document.getElementById('api_key').placeholder = t.placeholder;
    document.getElementById('help-text').innerText = t.help;
    document.getElementById('btn-save').innerText = t.save;
    document.getElementById('btn-cancel').innerText = t.cancel;

    function getQueryParam(variable, defaultValue) {
      var query = location.search.substring(1);
      var vars = query.split('&');
      for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (pair[0] === variable) {
          return decodeURIComponent(pair[1]);
        }
      }
      return defaultValue || false;
    }

    var prefillKey = getQueryParam('api_key', '');
    if (prefillKey) {
      document.getElementById('api_key').value = prefillKey;
    }

    document.getElementById('btn-save').addEventListener('click', function() {
      var keyValue = document.getElementById('api_key').value.trim();

      var configData = {
        'api_key': keyValue
      };

      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to + encodeURIComponent(JSON.stringify(configData));
    });

    document.getElementById('btn-cancel').addEventListener('click', function() {
      var return_to = getQueryParam('return_to', 'pebblejs://close#');
      document.location = return_to;
    });
  </script>
</body>
</html>
